name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build main source using an existing vMAJOR.MINOR.PATCH image version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: example-self-hosted-saas-app-pr
    concurrency:
      group: example-self-hosted-saas-app-pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Set up Buildx (per-job rootless BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: example-self-hosted-saas-app-main
    concurrency:
      group: example-self-hosted-saas-app-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      IMAGE_NAME: harbor.local/example-self-hosted-saas-app/example-self-hosted-saas-app
      REBUILD_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # Manual rebuilds always rebuild current main. A push must build the
          # exact commit it was triggered for: publication is serialized, so a
          # queued run would otherwise pick up a later commit and tag it.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Validate existing image version tag (build main source)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ ! "$REBUILD_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Rebuild tag must be vMAJOR.MINOR.PATCH.'
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$REBUILD_TAG" || {
            echo '::error::Rebuild tag must already exist in the source repository.'
            exit 1
          }
      - name: Set up Buildx (shared BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit:1234
      - name: Get and increment latest tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            NEW_TAG="$REBUILD_TAG"
            echo "Using provided tag: $NEW_TAG"
          else
            LATEST_TAG=""
            while IFS= read -r TAG; do
              if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                LATEST_TAG="$TAG"
                break
              fi
            done < <(git tag --list --sort=-v:refname)
            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="v1.0.0"
            else
              LATEST_TAG_NUMERIC=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG_NUMERIC"
              PATCH=$((10#$PATCH + 1))
              NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            fi
            echo "Latest tag: $LATEST_TAG"
            echo "New tag: $NEW_TAG"
          fi
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.NEW_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=min
      - name: Create and push new git tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "refs/tags/$NEW_TAG"
